<script>
(() => {
 const root=document.getElementById('photodeck-designs');
 const designs={
  graphite:{name:'Grafit',description:'Klasik araç rayı · katman ve renk paneli birlikte',scheme:'dark',accent:'#78d6ba',radius:5,tools:14},
  paper:{name:'Kağıt',description:'Sıcak açık yüzeyler · isimli araçlar · sakin görsel hiyerarşi',scheme:'light',accent:'#315a47',radius:9,tools:10},
  focus:{name:'Odak',description:'Geniş tuval · yüzen araç çubuğu · küçük katman paleti',scheme:'dark',accent:'#adc8ff',radius:12,tools:12},
  film:{name:'Fotoğraf Masası',description:'Altta fotoğraf şeridi · ton ayarları ön planda',scheme:'dark',accent:'#e3b982',radius:3,tools:14},
  workbench:{name:'Çalışma Tezgahı',description:'Solda özellikler · sağda araçlar · teknik çalışma düzeni',scheme:'dark',accent:'#8db9ee',radius:2,tools:14},
  ribbon:{name:'Şerit',description:'Üstte gruplanmış komutlar · etiketli araçlar · öğrenmesi kolay',scheme:'light',accent:'#4976c4',radius:4,tools:14,onAccent:'#ffffff'},
  ink:{name:'Çizim Atölyesi',description:'Fırça uçları ve renk paleti · çizim için ayrılmış alan',scheme:'dark',accent:'#d9b2e8',radius:7,tools:14},
  compact:{name:'Kompakt',description:'Yatay araç rayı · sıkı yerleşim · küçük dizüstü ekranları',scheme:'dark',accent:'#81c6d8',radius:0,tools:14},
  touch:{name:'Dokunmatik',description:'Büyük etiketli düğmeler · altta araçlar · dokunmaya uygun',scheme:'light',accent:'#206b57',radius:14,tools:14,onAccent:'#ffffff'},
  modular:{name:'Modüler',description:'Ayrı panel blokları · taşınabilir panel fikri · esnek çalışma alanı',scheme:'dark',accent:'#bccd89',radius:8,tools:14}
 };
 const toolData=[['move','Taşı','V'],['scan','Seç','M'],['crop','Kırp','C'],['paintbrush','Fırça','B'],['pencil','Kalem','P'],['eraser','Silgi','E'],['stamp','Klon','S'],['paint-bucket','Kova','F'],['blend','Degrade','G'],['type','Metin','T'],['square','Şekil','U'],['circle','Elips','O'],['pipette','Damlalık','I'],['hand','El','H']];
 const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
 const btn=(name,label,action,extra='')=>`<button type="button" class="cursor-interaction ${extra}" aria-label="${label}" data-action="${action}">${icon(name)}<span class="pd-action-label">${label}</span></button>`;
 const tools=limit=>toolData.slice(0,limit).map(([name,label,key],i)=>`<button type="button" class="pd-tool cursor-interaction ${i===3?'pd-active':''}" aria-label="${label} (${key})" aria-pressed="${i===3}" data-tooltip="${label} (${key})" data-tool="${label}">${icon(name)}<span class="pd-tool-label">${label}</span></button>`).join('');
 const layerData=[['subtitle','Alt başlık','T',''],['title','HORIZON','T',''],['hills','Dağ silüetleri','','pd-hills'],['sky','Gökyüzü','','pd-sky']];
 const layerMarkup=()=>layerData.map(([key,name,symbol,type])=>`<div class="pd-layer ${key==='hills'?'pd-current':''}" data-layer-row="${key}"><button type="button" class="pd-eye cursor-interaction" aria-label="${name} görünürlüğü" aria-pressed="true" data-layer="${key}">${icon('eye')}</button><span class="pd-thumb ${type}" aria-hidden="true">${symbol}</span><button type="button" class="pd-layer-name cursor-interaction" data-layer-select="${key}" data-tooltip="${name}">${name}</button></div>`).join('');
 const adjustments=()=>['Parlaklık','Kontrast','Doygunluk'].map((n,i)=>`<label class="pd-adjustment"><span>${n}<output>0</output></span><input type="range" min="-50" max="50" value="0" aria-label="${n}" data-adjust="${i}"></label>`).join('');
 const histogram=()=>`<div class="pd-hist" aria-label="Örnek görüntünün ton dağılımı">${Array.from({length:45},(_,i)=>`<i style="height:${8+Math.round(22*Math.exp(-Math.pow((i-15)/8,2)))+Math.round(11*Math.exp(-Math.pow((i-34)/5,2)))+((i*13)%8)}px"></i>`).join('')}</div>`;
 const inspector=()=>`<aside class="pd-inspector" aria-label="Katmanlar ve ayarlar">
  <section class="pd-brush-library"><div class="pd-panel-title">FIRÇA UÇLARI</div><div class="pd-brush-presets">${['Yuvarlak','Yumuşak','Kalem'].map((name,i)=>`<button type="button" class="cursor-interaction ${i===0?'pd-active':''}" data-preset="${name}"><span class="pd-brush-stroke"></span>${name}</button>`).join('')}</div></section>
  <section class="pd-palette" aria-label="Renk paleti">${['#e8d4b3','#81c2b3','#536caa','#d390a0','#c7b5e3','#dbe5e0','#2b414e'].map(color=>`<button type="button" class="cursor-interaction" style="--swatch:${color}" data-color="${color}" aria-label="Renk ${color}"></button>`).join('')}</section>
  <section class="pd-color-panel"><div class="pd-panel-title">RENK & TON ${icon('sliders-horizontal')}</div>${histogram()}${adjustments()}</section>
  <div class="pd-divider"></div>
  <section class="pd-layer-panel"><div class="pd-panel-title">KATMANLAR <button type="button" class="cursor-interaction" data-action="layer-options" aria-label="Katman seçenekleri">···</button></div><div class="pd-layer-top"><select aria-label="Harmanlama modu"><option>Normal</option><option>Çarp</option><option>Ekran</option><option>Kaplama</option></select><span>%100</span></div>${layerMarkup()}<div class="pd-layer-buttons">${[['plus','Katman ekle'],['copy','Çoğalt'],['square-dashed','Maske'],['lock-keyhole','Kilit'],['trash-2','Sil']].map(([name,label])=>`<button type="button" class="cursor-interaction" aria-label="${label}" data-tooltip="${label}" data-action="${label}">${icon(name)}</button>`).join('')}</div></section>
  <section class="pd-history"><div class="pd-panel-title">GEÇMİŞ</div><div class="pd-history-line">${icon('history')} Örnek çalışma açıldı</div></section>
 </aside>`;
 const tray=()=>`<div class="pd-tray" aria-label="Fotoğraf şeridi"><span class="pd-tray-label">FOTOĞRAFLAR</span>${['Horizon','Kıyı','Orman','Zirve','Akşam','Sis','Gökyüzü'].map((n,i)=>`<button type="button" class="cursor-interaction ${i===0?'pd-active':''}" data-photo="${n}" aria-pressed="${i===0}"><div class="pd-mini-photo" style="filter:hue-rotate(${i*12}deg)"></div>${n}</button>`).join('')}</div>`;
 const ribbon=()=>`<div class="pd-stage-tabs" role="group" aria-label="Komut grupları">${['Düzenle','Görüntü','Katman','Görünüm'].map((n,i)=>`<button type="button" class="cursor-interaction ${i===0?'pd-active':''}" data-command-tab="${n}">${n}</button>`).join('')}</div><div class="pd-command-groups">${[[['move','Taşı'],['scan','Seç'],['crop','Kırp']],[['paintbrush','Fırça'],['eraser','Silgi'],['stamp','Klon']],[['type','Metin'],['square','Şekil'],['sliders-horizontal','Renk']]].map((group,i)=>`<div class="pd-command-group">${group.map(([ic,n])=>`<button type="button" class="cursor-interaction" data-tool="${n}" aria-pressed="false">${icon(ic)}${n}</button>`).join('')}<small>${['Dönüştür','Rötuş','Tasarım'][i]}</small></div>`).join('')}</div>`;
 root.querySelectorAll('.pd-mount').forEach(mount=>{
  const key=mount.dataset.design,d=designs[key];
  mount.innerHTML=`<div class="pd-caption"><strong>${d.name}</strong><span>${d.description}</span></div>
  <div class="pd-app pd-${key}" aria-label="${d.name} tasarım seçenekleri" data-app="${key}">
   <header class="pd-top"><div class="pd-brand"><span class="pd-logo">P</span>PhotoDeck</div><nav class="pd-menus" aria-label="Ana menü">${['Dosya','Düzenle','Görüntü','Katman','Görünüm'].map(n=>`<button type="button" class="cursor-interaction" data-action="${n}">${n}</button>`).join('')}</nav><div class="pd-spacer"></div><div class="pd-head-actions">${btn('undo-2','Geri al','undo')}${btn('save','Kaydet','save')}${btn('arrow-up-right','Dışa aktar','export','pd-primary')}</div></header>
   ${key==='ribbon'?ribbon():''}
   <div class="pd-tabs"><button type="button" class="pd-tab-active cursor-interaction" data-action="document">${icon('image')} Horizon.pdeck<span class="pd-tab-close" aria-hidden="true">×</span></button><button type="button" class="pd-second-tab cursor-interaction" data-action="second-document">Poster.pdeck</button><div class="pd-spacer"></div><button type="button" class="cursor-interaction" data-action="new-document" aria-label="Yeni belge">${icon('plus')}</button></div>
   <div class="pd-options"><span class="pd-option-name">Fırça</span><span class="pd-rule"></span><label>Boyut <input type="number" min="1" max="512" value="32" aria-label="Fırça boyutu"><span>px</span></label><label>Sertlik <input type="number" min="0" max="100" value="80" aria-label="Fırça sertliği"><span>%</span></label><label class="pd-option-extra">Akış <input type="number" min="1" max="100" value="100" aria-label="Fırça akışı"><span>%</span></label></div>
   <div class="pd-workspace"><nav class="pd-tools" aria-label="Araçlar">${tools(d.tools)}<div class="pd-swatches"><input type="color" class="pd-color" value="#70c8b0" aria-label="Ön plan rengi"></div></nav>
   <main class="pd-area" aria-label="Düzenleme tuvali"><div class="pd-ruler" aria-hidden="true"><span>0</span><span>200</span><span>400</span><span>600</span><span>800</span><span>1000</span><span>1200</span><span>1400</span></div><div class="pd-floating-bar"><span>RGB · 8 bit</span><span>Horizon.pdeck</span></div><div class="pd-board"><canvas width="1400" height="1000" class="pd-scene" role="img" aria-label="Horizon dağ kompozisyonu"></canvas><span class="pd-art-text">HORIZON</span><span class="pd-art-sub">KENDİ YOLUNU BUL</span></div><span class="pd-area-label">1400 × 1000 px</span></main>
   ${inspector()}</div>${key==='film'?tray():''}
   <footer class="pd-bottom"><span class="pd-status" aria-live="polite">Fırça · B</span><span class="pd-zoom"><span class="pd-layer-count">4 katman</span><span>·</span><button type="button" class="cursor-interaction" data-action="zoom-out" aria-label="Uzaklaştır">−</button><span class="pd-zoom-value">%70</span><button type="button" class="cursor-interaction" data-action="zoom-in" aria-label="Yakınlaştır">+</button><button type="button" class="cursor-interaction" data-action="fit">Sığdır</button></span></footer>
  </div>`;
  const app=mount.querySelector('.pd-app');
  const state={...d,tool:'Fırça',zoom:70,visible:{subtitle:true,title:true,hills:true,sky:true},adjust:[0,0,0],density:key==='compact'?12:13};
  const scene=app.querySelector('canvas'),ctx=scene.getContext('2d');
  const status=message=>app.querySelector('.pd-status').textContent=message;
  function polygon(points,color){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=color;ctx.fill();}
  function draw(){
   ctx.clearRect(0,0,1400,1000);
   ctx.fillStyle='#a9b3b4';ctx.fillRect(0,0,1400,1000);
   if(state.visible.sky){const g=ctx.createLinearGradient(0,0,0,1000);g.addColorStop(0,'#172e47');g.addColorStop(.48,'#7ba9ab');g.addColorStop(1,'#c7cdc0');ctx.fillStyle=g;ctx.fillRect(0,0,1400,1000);ctx.fillStyle='#e2d4b6';ctx.beginPath();ctx.arc(1050,225,63,0,Math.PI*2);ctx.fill();}
   if(state.visible.hills){polygon([[0,620],[200,340],[340,510],[590,240],[900,600],[1120,390],[1400,560],[1400,1000],[0,1000]],'#627f85');polygon([[475,398],[590,240],[731,405],[620,355],[582,375],[551,338]],'#aec4bf');polygon([[0,750],[190,640],[360,725],[690,475],[930,780],[1150,570],[1400,730],[1400,1000],[0,1000]],'#244e5a');polygon([[0,825],[285,735],[455,905],[700,770],[1020,880],[1270,735],[1400,800],[1400,1000],[0,1000]],'#102e39');}
   app.querySelector('.pd-art-text').hidden=!state.visible.title;app.querySelector('.pd-art-sub').hidden=!state.visible.subtitle;
   scene.style.filter=`brightness(${1+state.adjust[0]/100}) contrast(${1+state.adjust[1]/100}) saturate(${1+state.adjust[2]/100})`;
   app.style.colorScheme=state.scheme;app.style.setProperty('--pd-accent',state.accent);app.style.setProperty('--pd-radius',state.radius+'px');app.style.setProperty('--pd-font',state.density+'px');if(state.onAccent)app.style.setProperty('--pd-on-accent',state.onAccent);
   app.querySelector('.pd-layer-count').textContent=Object.values(state.visible).filter(Boolean).length+' görünür';
  }
  draw();
  app.addEventListener('click',e=>{
   const button=e.target.closest('button');if(!button)return;
   if(button.dataset.tool){state.tool=button.dataset.tool;app.querySelectorAll('[data-tool]').forEach(b=>{const active=b.dataset.tool===state.tool;b.classList.toggle('pd-active',active);b.setAttribute('aria-pressed',String(active));});app.querySelector('.pd-option-name').textContent=state.tool;status(state.tool+' seçildi');}
   if(button.dataset.layer){const k=button.dataset.layer;state.visible[k]=!state.visible[k];button.setAttribute('aria-pressed',String(state.visible[k]));button.style.opacity=state.visible[k]?'1':'.45';status(layerData.find(l=>l[0]===k)[1]+(state.visible[k]?' gösterildi':' gizlendi'));draw();}
   if(button.dataset.layerSelect){app.querySelectorAll('.pd-layer').forEach(row=>row.classList.toggle('pd-current',row.dataset.layerRow===button.dataset.layerSelect));status(button.textContent+' seçildi');}
   if(button.dataset.photo){app.querySelectorAll('[data-photo]').forEach(b=>{b.classList.toggle('pd-active',b===button);b.setAttribute('aria-pressed',String(b===button));});scene.style.filter=`hue-rotate(${['Horizon','Kıyı','Orman','Zirve','Akşam','Sis','Gökyüzü'].indexOf(button.dataset.photo)*12}deg)`;status(button.dataset.photo+' · şerit önizlemesi');}
   if(button.dataset.preset){app.querySelectorAll('[data-preset]').forEach(b=>b.classList.toggle('pd-active',b===button));status(button.dataset.preset+' fırça ucu seçildi');}
   if(button.dataset.color){app.querySelector('input[type=color]').value=button.dataset.color;status('Ön plan rengi: '+button.dataset.color);}
   if(button.dataset.commandTab){app.querySelectorAll('[data-command-tab]').forEach(b=>b.classList.toggle('pd-active',b===button));status(button.dataset.commandTab+' komut grubu');}
   if(button.dataset.action){const a=button.dataset.action;if(a==='zoom-in'||a==='zoom-out'||a==='fit'){state.zoom=a==='fit'?70:Math.min(130,Math.max(30,state.zoom+(a==='zoom-in'?10:-10)));app.querySelector('.pd-zoom-value').textContent='%'+state.zoom;app.querySelector('.pd-board').style.transform=`scale(${Math.min(1.08,state.zoom/70)})`;status('Yakınlık: %'+state.zoom);}else if(a==='undo'){state.adjust=[0,0,0];app.querySelectorAll('[data-adjust]').forEach(input=>{input.value=0;input.closest('label').querySelector('output').textContent='0';});draw();status('Renk önizlemesi sıfırlandı');}else status((a==='save'?'Kaydet':a==='export'?'Dışa aktar':button.getAttribute('aria-label')||button.textContent.trim())+' · tasarım önizlemesi');}
  });
  app.addEventListener('input',e=>{if(e.target.matches('[data-adjust]')){state.adjust[Number(e.target.dataset.adjust)]=Number(e.target.value);e.target.closest('label').querySelector('output').textContent=e.target.value;draw();status(e.target.getAttribute('aria-label')+': '+e.target.value);}if(e.target.type==='color')status('Ön plan rengi: '+e.target.value);});
  if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:draw});tweak.addColorPicker(state,'accent',{label:'Vurgu rengi',reference:'--pd-accent'});tweak.addSlider(state,'radius',{label:'Köşe yumuşaklığı',min:0,max:18,step:1,unit:'px'});tweak.addSelect(state,'scheme',{label:'Görünüm',options:[{label:'Koyu',value:'dark'},{label:'Açık',value:'light'}]});}
 });
 if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});
})();
</script>
