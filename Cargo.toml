[package]
name = "photodeck"
version = "0.11.0-ea.2"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Native, local layered photo editor"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
rfd = "0.17.2"
arboard = "3.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
directories = "6"
fs2 = "0.4"
base64 = "0.22"
unicode-normalization = "0.1"
cosmic-text = "0.19"
fontdb = "0.23"
lcms2 = { version = "6", features = ["static"] }
png = "0.18"
tiff = "0.11"
flate2 = "1"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
octotablet = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", default-features = false, features = ["async-io", "print"] }
pollster = "0.4"

[dev-dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Gdi", "Win32_System_Memory", "Win32_Storage_Xps"] }

[[bin]]
name = "photodeck"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSImageView", "NSControl", "NSCell", "NSView", "NSPrintOperation", "NSPrintInfo", "NSGraphics", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString", "NSGeometry", "NSObject", "NSThread"] }
