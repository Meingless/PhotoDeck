name: Early access packages
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact source commit SHA to package
        required: true
        type: string
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: linux_gcc_64
            label: linux-x86_64
            cmake_args: ''
          - os: windows-2022
            arch: win64_msvc2022_64
            label: windows-x64
            cmake_args: ''
          - os: macos-15-intel
            arch: clang_64
            label: macos-intel
            cmake_args: '-DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0'
          - os: macos-15
            arch: clang_64
            label: macos-apple-silicon
            cmake_args: '-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PHOTO_VERSION: 0.10.0-ea.3
      PHOTO_TEST_SUITES: 24
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Verify release metadata and packaging inventory helper
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, plistlib, re, subprocess
          root = pathlib.Path('.')
          version = os.environ['PHOTO_VERSION']
          numeric = version.split('-')[0]
          header = (root/'src/version.h').read_text()
          assert re.search(r'Version = "([^"]+)"', header).group(1) == version
          assert f'project(PhotoDeck VERSION {numeric} LANGUAGES CXX)' in (root/'CMakeLists.txt').read_text()
          info = plistlib.loads((root/'packaging/Info.plist').read_bytes())
          assert info['CFBundleVersion'] == info['CFBundleShortVersionString'] == numeric
          assert version in (root/'scripts/package-linux-portable.py').read_text()
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          (root/'release-source.json').write_text(json.dumps({'version': version, 'source_commit': source, 'platform': os.environ['RUNNER_OS']}, indent=2)+'\n', encoding='utf-8')
          if os.environ.get('GITHUB_REF_TYPE') == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Release tag/version mismatch'
          PYTHON
          python3 -m unittest discover -s tests -p 'test_packaged_test_list.py' -v
      - name: Linux build helper regression tests
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tests -p 'test_build_script.py' -v
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libopengl0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.arch }}
          modules: 'qtimageformats'
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Configure
        run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build-release --config Release --parallel 4
      - name: Functional tests
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        run: ctest --test-dir build-release -C Release --output-on-failure --output-junit tests.xml --timeout 120
      - name: Record all packaged test suites
        shell: bash
        run: |
          python3 scripts/packaged-test-list.py --build-dir build-release --config Release --expected-count "$PHOTO_TEST_SUITES" > packaged-test-list.txt
          python3 -c "import os; from pathlib import Path; names=Path('packaged-test-list.txt').read_text().splitlines(); assert len(names)==int(os.environ['PHOTO_TEST_SUITES']); Path('packaged-test-count.txt').write_text(str(len(names))+'\n')"
      - name: Windows portable package
        env:
          QT_QPA_PLATFORM: windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $folder = "dist/PhotoDeck-$env:PHOTO_VERSION-windows-x64"
          New-Item -ItemType Directory -Force $folder | Out-Null
          Copy-Item build-release/Release/photodeck.exe "$folder/PhotoDeck.exe"
          windeployqt --release --compiler-runtime --no-translations --no-system-d3d-compiler --no-opengl-sw "$folder/PhotoDeck.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          $runtime = (Get-Content build-release/compiler-runtime.txt -Raw).Split(';', [System.StringSplitOptions]::RemoveEmptyEntries)
          foreach ($dll in $runtime) { Copy-Item $dll $folder/ }
          foreach ($required in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            if (!(Test-Path "$folder/$required")) { throw "Missing app-local compiler runtime: $required" }
          }
          Copy-Item README.md,EARLY-ACCESS.md,LICENSE $folder/
          Copy-Item -Recurse docs "$folder/docs"
          Copy-Item packaging/THIRD-PARTY.md $folder/
          Copy-Item -Recurse packaging/licenses,examples $folder/
          Set-Content "$folder/qt.conf" "[Paths]`nPrefix=.`nPlugins=.`n" -Encoding utf8NoBOM
          Copy-Item "$env:QT_ROOT_DIR/plugins/platforms/qoffscreen.dll" "$folder/platforms/"
          $proofRoot = (Get-Location).Path
          $packageRoot = (Resolve-Path $folder).Path
          $audit = Join-Path $packageRoot 'bin'
          New-Item -ItemType Directory $audit | Out-Null
          Set-Content "$audit/qt.conf" "[Paths]`nPrefix=..`nPlugins=.`n" -Encoding utf8NoBOM
          Copy-Item "$env:QT_ROOT_DIR/bin/Qt6Test.dll" "$audit/"
          Copy-Item -Recurse tests/fixtures "$audit/fixtures"
          $tests = @(Get-Content packaged-test-list.txt)
          if ($tests.Count -ne [int]$env:PHOTO_TEST_SUITES) { throw "Expected $env:PHOTO_TEST_SUITES packaged test suites" }
          $backup = Join-Path $env:RUNNER_TEMP ("photodeck-package-source-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory $backup | Out-Null
          $savedPath = $env:PATH
          $savedPlugins = $env:QT_PLUGIN_PATH
          $savedPlatformPlugins = $env:QT_QPA_PLATFORM_PLUGIN_PATH
          $savedPlatform = $env:QT_QPA_PLATFORM
          try {
            Move-Item "$proofRoot/tests" "$backup/tests"
            Move-Item "$proofRoot/examples" "$backup/examples"
            $env:PATH = "$packageRoot;$env:SystemRoot\System32;$env:SystemRoot"
            $env:QT_PLUGIN_PATH = $packageRoot
            $env:QT_QPA_PLATFORM_PLUGIN_PATH = Join-Path $packageRoot 'platforms'
            $process = Start-Process -FilePath "$packageRoot/PhotoDeck.exe" -ArgumentList '--no-settings','--preset','focus','--screenshot',"`"$proofRoot/windows-startup.png`"" -Wait -PassThru -RedirectStandardOutput "$proofRoot/windows-startup.log" -RedirectStandardError "$proofRoot/windows-startup-error.log"
            if ($process.ExitCode -ne 0 -or !(Test-Path "$proofRoot/windows-startup.png")) { Get-Content "$proofRoot/windows-startup-error.log"; throw "Windows package startup failed with exit $($process.ExitCode)" }
            $env:QT_QPA_PLATFORM = 'offscreen'
            foreach ($test in $tests) {
              Copy-Item "$proofRoot/build-release/Release/$test.exe" "$audit/$test.exe"
              & "$audit/$test.exe" -v1 -o "$proofRoot/$test-packaged.xml,junitxml" -o "$proofRoot/$test-packaged.txt,txt"
              if ($LASTEXITCODE -ne 0) { throw "Packaged runtime audit failed: $test" }
              Remove-Item "$audit/$test.exe"
            }
          } finally {
            $env:PATH = $savedPath
            $env:QT_PLUGIN_PATH = $savedPlugins
            $env:QT_QPA_PLATFORM_PLUGIN_PATH = $savedPlatformPlugins
            $env:QT_QPA_PLATFORM = $savedPlatform
            foreach ($source in 'tests','examples') {
              if (Test-Path "$backup/$source") { Move-Item "$backup/$source" "$proofRoot/$source" }
            }
            Remove-Item $backup
            Remove-Item -Recurse $audit
          }
          if (Test-Path $audit) { throw "Packaged test tools and fixtures were not removed" }
          Compress-Archive -Path $folder -DestinationPath "$folder.zip"
      - name: macOS application package
        env:
          QT_QPA_PLATFORM: cocoa
        if: runner.os == 'macOS'
        run: |
          folder="dist/PhotoDeck-$PHOTO_VERSION-${{ matrix.label }}"
          mkdir -p "$folder"
          cp -R build-release/photodeck.app "$folder/PhotoDeck.app"
          macdeployqt "$folder/PhotoDeck.app"
          cp README.md EARLY-ACCESS.md LICENSE packaging/THIRD-PARTY.md "$folder/"
          cp -R docs "$folder/docs"
          cp -R packaging/licenses examples "$folder/"
          codesign --force --deep --sign - "$folder/PhotoDeck.app"
          "$folder/PhotoDeck.app/Contents/MacOS/photodeck" --no-settings --preset focus --screenshot macos-startup.png
          test -s macos-startup.png
          codesign --verify --deep --strict "$folder/PhotoDeck.app"
          ditto -c -k --sequesterRsrc --keepParent "$folder" "$folder.zip"
      - name: Linux portable package
        if: runner.os == 'Linux'
        run: |
          python3 scripts/package-linux-portable.py --binary build-release/photodeck --qt "$QT_ROOT_DIR" --output dist --version "$PHOTO_VERSION"
          "dist/PhotoDeck-$PHOTO_VERSION-linux-x86_64/launch.sh" --no-settings --preset focus --screenshot linux-startup.png
          test -s linux-startup.png
          package="dist/PhotoDeck-$PHOTO_VERSION-linux-x86_64"
          proof_root="$PWD"
          package_root="$PWD/$package"
          cp "$QT_ROOT_DIR/lib/libQt6Test.so.6" "$package/lib/"
          cp -R tests/fixtures "$package/bin/fixtures"
          while IFS= read -r test; do
            cp "build-release/$test" "$package/bin/$test"
          done < packaged-test-list.txt
          source_backup=$(mktemp -d "$RUNNER_TEMP/photodeck-package-source.XXXXXX")
          restore_package_audit() {
            local status=$?
            trap - EXIT
            for source in tests examples; do
              if [ -d "$source_backup/$source" ]; then
                mv "$source_backup/$source" "$proof_root/$source" || status=1
              fi
            done
            while IFS= read -r test; do
              rm -f "$package_root/bin/$test" || status=1
            done < "$proof_root/packaged-test-list.txt"
            rm -f "$package_root/lib/libQt6Test.so.6" || status=1
            rm -rf "$package_root/bin/fixtures" || status=1
            rmdir "$source_backup" || status=1
            return "$status"
          }
          trap restore_package_audit EXIT
          mv tests "$source_backup/tests"
          mv examples "$source_backup/examples"
          python3 - "$package_root" "$proof_root/packaged-test-list.txt" <<'PYTHON'
          import os, pathlib, re, subprocess, sys
          package = pathlib.Path(sys.argv[1]).resolve()
          names = pathlib.Path(sys.argv[2]).read_text().splitlines()
          env = dict(os.environ, LD_LIBRARY_PATH=str(package/'lib'), LC_ALL='C')
          for name in ['photodeck', *names]:
              result = subprocess.run(['ldd', str(package/'bin'/name)], env=env,
                                      capture_output=True, text=True, check=True)
              pathlib.Path(name+'-packaged-ldd.txt').write_text(result.stdout, encoding='utf-8')
              assert 'not found' not in result.stdout, (name, result.stdout)
              qt_paths = re.findall(r'^\s*libQt6\S+\s+=>\s+(\S+)', result.stdout, re.MULTILINE)
              assert qt_paths, f'No Qt dependencies found for {name}'
              for path in qt_paths:
                  assert pathlib.Path(path).resolve().is_relative_to(package/'lib'), (name, path)
          PYTHON
          while IFS= read -r test; do
            LD_LIBRARY_PATH="$package_root/lib" QT_PLUGIN_PATH="$package_root/plugins" QT_QPA_PLATFORM_PLUGIN_PATH="$package_root/plugins/platforms" "$package_root/bin/$test" -v1 -o "$proof_root/$test-packaged.xml,junitxml" -o "$proof_root/$test-packaged.txt,txt"
          done < "$proof_root/packaged-test-list.txt"
          restore_package_audit
          test ! -e "$package/bin/fixtures"
      - name: Linux AppImage
        if: runner.os == 'Linux'
        run: |
          mkdir -p appimage-tools
          python3 - <<'PY'
          import pathlib,hashlib,urllib.request
          target=pathlib.Path('appimage-tools/appimagetool.AppImage')
          url='https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage'
          with urllib.request.urlopen(url,timeout=90) as response:
              target.write_bytes(response.read())
          assert hashlib.sha256(target.read_bytes()).hexdigest()=='ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0'
          target.chmod(0o755)
          PY
          (cd appimage-tools && ./appimagetool.AppImage --appimage-extract > /dev/null)
          python3 scripts/package-appimage.py --package "dist/PhotoDeck-$PHOTO_VERSION-linux-x86_64" --appimagetool appimage-tools/squashfs-root/AppRun --output "dist/PhotoDeck-$PHOTO_VERSION-x86_64.AppImage"
          APPIMAGE_EXTRACT_AND_RUN=1 "dist/PhotoDeck-$PHOTO_VERSION-x86_64.AppImage" --no-settings --screenshot appimage-startup.png
          test -s appimage-startup.png
      - name: Verify packaged application version
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, subprocess
          version = os.environ['PHOTO_VERSION']
          platform = os.environ['RUNNER_OS']
          if platform == 'Windows':
              binary = pathlib.Path(f'dist/PhotoDeck-{version}-windows-x64/PhotoDeck.exe')
          elif platform == 'macOS':
              binary = pathlib.Path(f'dist/PhotoDeck-{version}-${{ matrix.label }}/PhotoDeck.app/Contents/MacOS/photodeck')
          else:
              binary = pathlib.Path(f'dist/PhotoDeck-{version}-linux-x86_64/launch.sh')
          env = dict(os.environ, QT_COMMAND_LINE_PARSER_NO_GUI_MESSAGE_BOXES='1')
          env['QT_QPA_PLATFORM'] = 'cocoa' if platform == 'macOS' else 'offscreen'
          if platform == 'Windows':
              package = binary.resolve().parent
              system = pathlib.Path(os.environ['SystemRoot'])
              env['PATH'] = os.pathsep.join(map(str, [package, system/'System32', system]))
              env['QT_PLUGIN_PATH'] = str(package)
              env['QT_QPA_PLATFORM_PLUGIN_PATH'] = str(package/'platforms')
          result = subprocess.run([str(binary.resolve()), '--version'], env=env,
                                  capture_output=True, text=True, check=True, timeout=60)
          actual = result.stdout.strip()
          assert actual == f'PhotoDeck {version}', (actual, result.stderr)
          pathlib.Path('package-version.txt').write_text(actual+'\n', encoding='utf-8')
          PYTHON
      - name: Checksums
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,hashlib
          p=pathlib.Path('dist')
          lines=[hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.name for f in sorted(p.iterdir()) if f.is_file() and f.name.endswith(('.zip','.tar.gz','.AppImage'))]
          (p/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PhotoDeck-${{ matrix.label }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.AppImage
            dist/SHA256SUMS.txt
            build-release/tests.xml
            build-release/*-native.xml
            build-release/*-native.txt
            build-release/Testing/Temporary/
            packaged-test-list.txt
            packaged-test-count.txt
            package-version.txt
            release-source.json
            docs/releases/0.10.0-ea.3.md
            docs/DEVELOPMENT-0.10.md
            *-startup.png
            *-startup*.log
            *-packaged.xml
            *-packaged.txt
            *-packaged-ldd.txt
          if-no-files-found: warn
          retention-days: 30
