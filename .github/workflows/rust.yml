name: Rust build and packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x64
          - os: macos-15-intel
            platform: macos-intel
          - os: macos-15
            platform: macos-apple-silicon
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Packaging regression tests
        run: python -m unittest discover -s scripts/tests -p test_package_rust.py -v
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev xvfb fonts-dejavu-core
      - name: Fetch pinned dependencies and license sources
        run: cargo fetch --locked
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Native Rust tests
        run: cargo test --all-targets --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Native package and extracted executable smoke
        run: python scripts/package-rust.py --platform ${{ matrix.platform }} --source-sha ${{ github.sha }} --output dist --smoke
      - name: Linux extracted package GUI startup
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WINIT_UNIX_BACKEND: x11
        run: |
          mkdir -p package-smoke
          tar -xzf dist/PhotoDeck-*-linux-x86_64.tar.gz -C package-smoke
          timeout 60 xvfb-run -a package-smoke/PhotoDeck-*/photodeck --no-settings --screenshot "$PWD/dist/linux-package-startup.png"
          test -s dist/linux-package-startup.png
      - uses: actions/upload-artifact@v4
        with:
          name: photodeck-${{ matrix.platform }}
          if-no-files-found: error
          path: dist/*
