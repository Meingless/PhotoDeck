name: Rust build and packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            binary: target/release/photodeck
          - os: windows-2022
            platform: windows-x64
            release_args: --target x86_64-pc-windows-msvc
            release_rustflags: -C target-feature=+crt-static
            binary: target/x86_64-pc-windows-msvc/release/photodeck.exe
          - os: macos-15-intel
            platform: macos-intel
            binary: target/release/photodeck
          - os: macos-15
            platform: macos-apple-silicon
            binary: target/release/photodeck
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Packaging regression tests
        run: python -m unittest discover -s scripts/tests -p test_package_rust.py -v
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev libegl1-mesa-dev xvfb fonts-dejavu-core
      - name: Fetch pinned dependencies and license sources
        run: cargo fetch --locked
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Native Rust tests
        run: cargo test --all-targets --locked
      - name: Release build
        env:
          RUSTFLAGS: ${{ matrix.release_rustflags }}
        run: cargo build --release --locked ${{ matrix.release_args }}
      - name: Software OpenGL for Windows hosted runner GUI checks
        if: runner.os == 'Windows'
        shell: pwsh
        # The hosted VM exposes only OpenGL 1.1. These test-only Mesa DLLs
        # stay beside the build binary; package-rust.py copies only the EXE.
        run: |
          $mesaArchive = Join-Path $env:RUNNER_TEMP 'mesa3d-26.2.6.7z'
          $mesaRoot = Join-Path $env:RUNNER_TEMP 'photodeck-mesa'
          Invoke-WebRequest -Uri 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.6/mesa3d-26.2.6-release-mingw.7z' -OutFile $mesaArchive -MaximumRetryCount 3 -RetryIntervalSec 3
          $expected = 'da0f71d9181b672c1918f3c342f11118c687f6059a46b16502845160733cc388'
          if ((Get-FileHash $mesaArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Mesa archive SHA-256 mismatch' }
          7z x $mesaArchive "-o$mesaRoot" x64/opengl32.dll x64/libgallium_wgl.dll -y
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          $binaryDir = Split-Path '${{ matrix.binary }}'
          Copy-Item "$mesaRoot/x64/opengl32.dll", "$mesaRoot/x64/libgallium_wgl.dll" -Destination $binaryDir
          Add-Content -Path $env:GITHUB_ENV -Value 'GALLIUM_DRIVER=llvmpipe'
      - name: Native keyboard test dependencies
        if: runner.os == 'Linux'
        run: python -m pip install python-xlib
      - name: Native keyboard, undo, save and reopen
        if: runner.os != 'Linux'
        # Hosted macOS runners may deny System Events Accessibility access.
        # Always preserve the proof JSON; a denied run is not a passing test.
        continue-on-error: ${{ runner.os == 'macOS' }}
        run: python scripts/native-ui-smoke.py --binary ${{ matrix.binary }} --output artifacts/native-ui
      - name: Linux native keyboard, undo, save and reopen
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python scripts/native-ui-smoke.py --binary ${{ matrix.binary }} --output artifacts/native-ui
      - name: Native compact and scaled window screenshots
        if: runner.os != 'Linux'
        shell: bash
        run: |
          mkdir -p artifacts/native-ui
          "${{ matrix.binary }}" --no-settings --window-size 800 560 --screenshot "$PWD/artifacts/native-ui/compact.png"
          "${{ matrix.binary }}" --no-settings --window-size 1380 900 --ui-scale 1.5 --screenshot "$PWD/artifacts/native-ui/scaled.png"
      - name: Linux compact and scaled window screenshots
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a "${{ matrix.binary }}" --no-settings --window-size 800 560 --screenshot "$PWD/artifacts/native-ui/compact.png"
          xvfb-run -a "${{ matrix.binary }}" --no-settings --window-size 1380 900 --ui-scale 1.5 --screenshot "$PWD/artifacts/native-ui/scaled.png"
      - name: Preserve native GUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-${{ matrix.platform }}
          if-no-files-found: warn
          path: artifacts/native-ui/
      - name: Native package and extracted executable smoke
        run: python scripts/package-rust.py --platform ${{ matrix.platform }} --source-sha ${{ github.sha }} --output dist --binary ${{ matrix.binary }} --smoke
      - name: Linux extracted package GUI startup
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WINIT_UNIX_BACKEND: x11
        run: |
          mkdir -p package-smoke
          tar -xzf dist/PhotoDeck-*-linux-x86_64.tar.gz -C package-smoke
          timeout 60 xvfb-run -a package-smoke/PhotoDeck-*/photodeck --no-settings --screenshot "$PWD/dist/linux-package-startup.png"
          test -s dist/linux-package-startup.png
      - uses: actions/upload-artifact@v4
        with:
          name: photodeck-${{ matrix.platform }}
          if-no-files-found: error
          path: dist/*
