name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }} / Qt 6.8.3
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: linux_gcc_64
            label: linux-x86_64
            cmake_args: ''
          - os: windows-2022
            arch: win64_msvc2022_64
            label: windows-x64
            cmake_args: ''
          - os: macos-15-intel
            arch: clang_64
            label: macos-intel
            cmake_args: '-DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0'
          - os: macos-15
            arch: clang_64
            label: macos-apple-silicon
            cmake_args: '-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Release tooling regression tests
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libopengl0
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.arch }}
          modules: 'qtimageformats'
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Configure
        run: cmake -S . -B build-validation -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build-validation --config Release --parallel 4
      - name: Functional and parser regression tests
        run: ctest --test-dir build-validation -C Release --output-on-failure --output-junit tests.xml --timeout 120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.label }}
          path: |
            build-validation/tests.xml
            build-validation/*-native.xml
            build-validation/*-native.txt
            build-validation/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 14

  sanitizers:
    name: Linux / ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      # The prebuilt Qt SDK is not sanitizer-instrumented. This job checks the
      # application and tests; process-exit leak detection is a separate task.
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Compiler and Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang llvm libxcb-cursor0 libxkbcommon-x11-0 libopengl0
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: linux_gcc_64
          modules: 'qtimageformats'
          cache: true
      - name: Configure instrumented build
        run: |
          cmake -S . -B build-sanitizers \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DCMAKE_CXX_COMPILER=clang++ \
            '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer' \
            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined'
      - name: Build
        run: cmake --build build-sanitizers --parallel 4
      - name: Instrumented functional and parser regression tests
        run: ctest --test-dir build-sanitizers -C Debug --output-on-failure --output-junit tests.xml --timeout 120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-linux-sanitizers
          path: |
            build-sanitizers/tests.xml
            build-sanitizers/*-native.xml
            build-sanitizers/*-native.txt
            build-sanitizers/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 14
